version: 2
updates:
  # ONE npm entry for the whole monorepo, not one per workspace.
  #
  # The repo root declares no dependencies of its own -- it is a pure npm
  # workspaces root (`workspaces: ["apps/*", "packages/*"]`, scripts only).
  # Dependabot resolves this entry against the single root
  # package-lock.json, so it already sees and updates every workspace:
  # PR #29 was opened from this entry and edited apps/api-byoc/package.json,
  # apps/web/package.json, packages/shared/package.json AND
  # package-lock.json together.
  #
  # There used to be three additional entries (/apps/web, /apps/api-byoc,
  # /packages/shared). Do not add them back. They produced two or three
  # PRs for the same package (e.g. @types/node arrived as #18, #25 and
  # #26), and -- worse -- a per-workspace PR edits only that workspace's
  # package.json and never the root lockfile, leaving the two out of sync
  # on merge, which breaks `npm ci`. PRs #9 and #15 landed that way and
  # needed a follow-up commit to repair the lockfile.
  #
  # Patch/minor bumps are grouped into one PR to cut noise; majors are left
  # ungrouped so each gets its own PR and its own deliberate review (see
  # docs/architecture.md's "Keeping the stack current" for why majors here
  # aren't routine bumps).
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

  # apps/api-byoc/Dockerfile's node:20-alpine base image.
  - package-ecosystem: "docker"
    directory: "/apps/api-byoc"
    schedule:
      interval: "weekly"

  # Action version pins in .github/workflows/*.yml (actions/checkout,
  # docker/login-action, docker/metadata-action, docker/build-push-action).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
