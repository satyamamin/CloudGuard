# Builds and pushes apps/api-byoc's Dockerfile to GHCR so infra/bicep/main.bicep's
# container-app.bicep has a real image to pull. NOTE: GitHub Packages default
# new packages to private — after the first successful push, set the
# `finops-lab-api` package visibility to Public in repo/org package settings,
# since the Container App has no registry credentials configured (see
# infra/bicep/README.md).
#
# Two build paths, both push to the same image:
# - Push to main -> tags `latest` + the commit `sha` (a moving target, meant
#   for local/dev-loop use, not for what new customers deploy by default).
# - Push a `vX.Y.Z` git tag (a deliberate release) -> tags the image `X.Y.Z`
#   (docker/metadata-action strips the leading `v` — standard Docker
#   convention). This is the tag customers should pin `containerImage` to in
#   infra/bicep/main.bicep for a stable, rollback-able deployment, and the
#   one that should get a real smoke-test run (apps/api-byoc/scripts/smoke-test.mjs)
#   before being cut. `paths:` filtering is intentionally NOT used here (a
#   release tag usually points at a commit already on main with no new diff
#   of its own, which `paths:` would silently skip) — the tradeoff is this
#   workflow reruns on any push to main, not just apps/api-byoc changes.
name: Build API image

on:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/finops-lab-api
          tags: |
            type=raw,value=latest,enable=${{ github.ref_type == 'branch' }}
            type=sha,enable=${{ github.ref_type == 'branch' }}
            type=semver,pattern={{version}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api-byoc/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
