# Builds and pushes apps/api-byoc's Dockerfile to GHCR so infra/bicep/main.bicep's
# container-app.bicep has a real image to pull. NOTE: GitHub Packages default
# new packages to private — after the first successful push, set the
# `cloudguard-api` package visibility to Public in repo/org package settings,
# since the Container App has no registry credentials configured (see
# infra/bicep/README.md).
name: Build API image

on:
  push:
    branches: [ main ]
    paths:
      - 'apps/api-byoc/**'
      - 'packages/shared/**'
      - '.github/workflows/build-api-image.yml'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api-byoc/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/cloudguard-api:latest,ghcr.io/${{ github.repository_owner }}/cloudguard-api:${{ github.sha }}
