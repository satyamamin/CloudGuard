# Pré-merge : tests, build, lint, build Docker, cohérence Bicep, audit.
# Séparé de build-api-image.yml exprès : ce dernier publie sur GHCR (push: true)
# et ne doit jamais tourner sur une PR non relue. Ici, rien n'est publié.
#
# Ce workflow est aussi réutilisable (workflow_call) : build-api-image.yml
# l'appelle avant de publier, pour qu'une image ne soit jamais poussée si les
# tests échouent. Il n'a donc plus de déclencheur `push: main` propre — le
# push sur main passe par build-api-image.yml, ce qui évite de tout exécuter
# deux fois.
name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

# Annule l'exécution précédente d'une même PR quand on repousse un commit.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Rapide (~1 min) : ne nécessite ni `prisma generate` ni le build de
  # packages/shared (jest mappe @finops-lab/shared sur ses sources, la base
  # et le SDK Azure sont mockés).
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - run: npm ci

      - name: Tests packages/shared (Vitest)
        working-directory: packages/shared
        run: npx vitest run --config vitest.config.mts

      - name: Tests apps/api-byoc (Jest + couverture)
        run: npm run test:cov -w apps/api-byoc

      - name: Publier le rapport de couverture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-api-byoc
          path: apps/api-byoc/coverage
          if-no-files-found: ignore

  build-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      # `npm ci` exige que package.json et package-lock.json concordent
      # (voir .github/dependabot.yml : une seule entrée npm à la racine).
      - run: npm ci

      - run: npm run build:shared

      # apps/api-byoc/src/generated/prisma est gitignoré (artefact de build) :
      # il faut le générer avant `nest build` — même ordre que le Dockerfile.
      # DATABASE_URL est factice : `generate` ne se connecte jamais.
      - run: npx prisma generate --schema apps/api-byoc/prisma/schema.prisma
        env:
          DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"

      - run: npm run build -w apps/api-byoc

      - run: npm run lint -w apps/web

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Le contrôle que le dev local ne peut structurellement pas faire :
      # l'étage runtime ne copie que le node_modules RACINE ; si npm imbrique
      # une vraie dépendance sous apps/api-byoc/node_modules, l'image part
      # sans elle et plante au boot, alors que `npm run build` passe.
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api-byoc/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # infra/bicep/main.json est versionné (c'est lui que le bouton « Deploy to
  # Azure » consomme). Ce job échoue s'il dérive de main.bicep.
  # Les blocs `_generator` (version/hash du compilateur Bicep, présents à la
  # racine ET dans chaque module imbriqué) sont ignorés : ils changent à
  # chaque mise à jour de Bicep sans que le modèle change.
  bicep-in-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Compiler main.bicep
        run: az bicep build --file infra/bicep/main.bicep --outfile "$RUNNER_TEMP/main.json"

      - name: Vérifier que infra/bicep/main.json est à jour
        run: |
          strip='walk(if type=="object" then del(._generator) else . end)'
          if ! diff <(jq -S "$strip" "$RUNNER_TEMP/main.json") <(jq -S "$strip" infra/bicep/main.json); then
            echo "::error file=infra/bicep/main.json::main.json n'est pas synchronisé avec main.bicep. Régénérer : az bicep build --file infra/bicep/main.bicep --outfile infra/bicep/main.json"
            exit 1
          fi

  # Informatif au départ (continue-on-error) : à rendre bloquant une fois les
  # alertes existantes traitées (retirer la ligne continue-on-error).
  audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - run: npm ci

      - name: Audit des dépendances de production
        run: npm audit --workspaces --include-workspace-root --omit=dev --audit-level=high || true
